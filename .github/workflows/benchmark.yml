name: Benchmark

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  compute-units:
    name: Compute Units
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          install-anchor: 'true'
          install-nightly-rustfmt: 'true'
          rust-cache-key: 'benchmark'

      - name: Build IDL and clients
        run: |
          pnpm run generate-idl
          pnpm run generate-clients

      - name: Run benchmark
        run: CU_REPORT=1 CU_REPORT_DATE=$(date +%Y-%m-%d) cargo test -p integration-tests

      - name: Report compute units
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: solana-foundation/github-actions/cu-benchmark@e6ed2eb93c55eca911dbc711fb08683b42926a28
