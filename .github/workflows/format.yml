name: Format

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          install-nightly-rustfmt: 'true'
          install-solana: 'false'
          install-just: 'false'
          install-pnpm: 'false'
          rust-cache-key: 'format'
      - name: Check Rust formatting
        run: cargo +nightly fmt -p async_vault -p vault_common -p integration-tests -- --check
      - name: Run Clippy
        run: cargo clippy -p async_vault -p vault_common

  typescript-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          install-nightly-rustfmt: 'true'
          install-solana: 'false'
          install-just: 'false'
          rust-cache-key: 'typescript-format'
      - run: pnpm run format:check
      - run: pnpm run generate-clients
      - run: pnpm lint
      - run: pnpm --filter @solana/vault-program-web typecheck
      - run: pnpm --filter @solana/vault-program-web build
